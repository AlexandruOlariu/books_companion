# Reading Library API  ->  https://ai.duk-tech.com/books-api/
#
# Included from inside the existing `server { ... }` block of
# /etc/nginx/sites-enabled/ai.duk-tech.com.conf with this one line:
#
#     include /home/duk-tech/books/server/deploy/nginx-books-api.conf;
#
# The trailing slash on proxy_pass strips the /books-api/ prefix, so the app
# sees /auth/login, /me, /friends, ... Nothing else in that file is touched.
location /books-api/ {
    proxy_pass http://127.0.0.1:8300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API reads the client address from X-Forwarded-For for its rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A published shelf of 5000 books is well under 2 MB; a saved library
    # (notes and sessions included, no covers) is capped at 20 MB by the API.
    client_max_body_size 22M;
    proxy_read_timeout 60s;
}
