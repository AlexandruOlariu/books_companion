name: books-server

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: books
    volumes:
      - books-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the api container can reach the database.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://books:${POSTGRES_PASSWORD}@db:5432/books
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PHONE_PEPPER: ${PHONE_PEPPER:?set PHONE_PEPPER in .env}
      # Optional push notifications; empty keeps them off (docs/backend.md).
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
    volumes:
      # Holds the Firebase service-account key, if you use push. Git-ignored.
      - ./secrets:/srv/secrets:ro
    ports:
      # Localhost only. nginx is the public entry point (deploy/nginx-books-api.conf).
      - "127.0.0.1:8300:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  books-db:
