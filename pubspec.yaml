name: reading_library
description: A private, local-first reading room for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  drift: 2.35.1
  sqlite3: 3.7.0
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  image_picker: 1.2.4
  file_picker: 13.1.0
  share_plus: 13.3.1
  cross_file: 0.3.5+5
  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DMSans-LICENSE.txt
    - assets/fonts/Literata-LICENSE.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
