name: Release APK

# Every push to main tests, builds, and publishes an APK as a new GitHub
# Release, versioned automatically (tool/next_release_version.sh). Put
# [skip release] in the head commit message to push without releasing. Pushing
# a tag such as v0.2.0 (it must match pubspec.yaml) releases under that exact
# name. Run it by hand (Actions tab) to build an APK artifact without
# publishing. See docs/release.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.ref_type == 'tag' || github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      # All tags are needed to pick the next version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: ./tool/check_docs.sh
      - run: ./tool/test_release_scripts.sh

      # A pushed tag must agree with pubspec.yaml and is released as it is. A
      # push to main gets the next version automatically and a new tag. A
      # manual run only builds (no tag, nothing published).
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=$(./tool/release_version.sh "${GITHUB_REF_NAME}")
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version=$(./tool/next_release_version.sh)
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          else
            version="$(./tool/release_version.sh)-dev"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./tool/ci_prepare_signing.sh >> "$GITHUB_OUTPUT"

      # Push notifications: the Firebase client configuration is per-owner and
      # git-ignored (docs/release.md). Without the secret the APK still builds
      # but cannot receive notifications.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      # The build number must rise with every release for Android to accept an
      # update, so it comes from the run number rather than from pubspec.yaml.
      - name: Build APK
        env:
          READING_LIBRARY_DEBUG_SIGNING: ${{ steps.signing.outputs.signed == 'true' && '0' || '1' }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Name and checksum
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/reading-library.apk
          if [ "$SIGNED" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            python3 tool/create_update_manifest.py
          fi
          (cd dist && sha256sum reading-library.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: reading-library-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reading-library-apk
          path: dist
      - name: Publish release
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            flag=""
            note="Signed with the project's upload key. It installs over earlier builds signed with the same key."
          else
            flag="--prerelease"
            note="**Debug-signed test build.** It installs for testing, but it cannot update a build signed with a different key (uninstall first and export a backup from Settings), and Google Play rejects it."
          fi
          printf '%s\n\n%s\n\nSHA-256 is in SHA256SUMS.txt. Built by CI after format, analyze, tests, and docs checks passed.\n' \
            "$note" "Android 7.0 or newer. Open the APK on the phone and allow installing from this source when asked." > notes.md
          # For a push to main the tag does not exist yet: it is created here, on
          # the commit that was tested. (A tag made with the workflow's own token
          # does not start another run.)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md --generate-notes $flag
